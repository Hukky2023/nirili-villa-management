name: Nirili Management Android (development)
on:
  workflow_dispatch:
  push:
    branches:
      - feature/native-android-management
    paths:
      - 'android-management/**'
      - '.github/workflows/android-management.yml'
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        working-directory: android-management
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nirili-management-debug-apk
          path: android-management/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
