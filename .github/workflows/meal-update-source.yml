name: Half-board update source snapshot
on:
  push:
    branches: [fix/half-board-daily-meals]
    paths: [.github/workflows/meal-update-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive --format=zip HEAD --output=meal-update-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: meal-update-source
          path: meal-update-source.zip
          retention-days: 1
