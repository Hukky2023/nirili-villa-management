name: Mobile app checks

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
  push:
    branches:
      - "mobile/android-ios-app"
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-checks.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
      - run: npm install
      - run: npm run typecheck
      - run: npx expo config --type public
      - run: npm run doctor

  android-debug:
    runs-on: ubuntu-latest
    needs: validate
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Install Android SDK 36
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm install
      - run: npx expo prebuild --platform android --clean --non-interactive
      - run: ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v7
        with:
          name: nirili-villa-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  ios-generate:
    runs-on: macos-latest
    needs: validate
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.0"
      - run: npm install
      - run: npx expo prebuild --platform ios --clean --non-interactive
      - run: pod install
        working-directory: mobile/ios
      - run: xcodebuild -workspace NiriliVilla.xcworkspace -scheme NiriliVilla -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
        working-directory: mobile/ios
