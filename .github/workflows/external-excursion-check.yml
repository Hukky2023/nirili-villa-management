name: External excursion feature check

on:
  push:
    branches: [feature/external-excursion-booking]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node --test tests/room-workspace.test.mjs
      - run: node --experimental-strip-types --test tests/dashboard-data.test.mjs
      - run: node --test tests/account-history.test.mjs
      - run: node --experimental-strip-types --test tests/excursion-billing.test.mjs
      - run: node --test tests/excursion-trip-counts.test.cjs
      - run: pnpm run build
