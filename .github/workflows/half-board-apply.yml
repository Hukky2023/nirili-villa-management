name: Validate and integrate Half Board update
on:
  push:
    branches: [fix/half-board-daily-meals]
    paths: [.half-board-edits.json, scripts/apply-half-board-update.py, .github/workflows/half-board-apply.yml]
permissions:
  contents: write
concurrency:
  group: half-board-integration
  cancel-in-progress: false
jobs:
  validate-and-integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified source changes
        run: python3 scripts/apply-half-board-update.py
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: All billing and operational regression tests
        run: node --experimental-strip-types --test tests/half-board-meals.test.mjs tests/dashboard-data.test.mjs tests/account-history.test.mjs tests/excursion-billing.test.mjs
      - name: Full production build
        run: pnpm run build && node self-host-config.mjs dc69f294-de1e-4cd4-8322-93da8739eb73
      - name: Commit tested source to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- app lib scripts/apply-half-board-update.py .half-board-edits.json
          git diff --cached --check
          git commit -m 'Integrate tested daily Half Board selection with restaurant and room billing'
          git push origin HEAD:fix/half-board-daily-meals
          echo "Validated source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
