name: Build Nirili Android APK

on:
  workflow_dispatch:

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Missing repository secret FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
            exit 1
          fi

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > mobile/android/app/google-services.json

          APP_ID="$(jq -r '.client[0].client_info.android_client_info.package_name' mobile/android/app/google-services.json)"
          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            echo "::error::Could not read Android package name from google-services.json"
            exit 1
          fi

          echo "NIRILI_ANDROID_APPLICATION_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "Firebase package: $APP_ID"

      - name: Build debug APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Nirili-Villa-Management-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
