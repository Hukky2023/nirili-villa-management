name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.25.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Room workspace and checkout buggy regression tests
        run: node --test tests/room-workspace.test.mjs
      - name: Dashboard data regression tests
        run: node --experimental-strip-types --test tests/dashboard-data.test.mjs
      - name: Account history and access regression tests
        run: node --test tests/account-history.test.mjs
      - name: Guest transport plan regression tests
        run: node --experimental-strip-types --test tests/transport-plan.test.mjs
      - name: Admin manual guest transfer regression tests
        run: node --test tests/admin-manual-transfer.test.mjs
      - name: Restaurant meal-plan regression tests
        run: node --experimental-strip-types --test tests/meal-access.test.mjs
      - name: Restaurant room-billing regression tests
        run: node --experimental-strip-types --test tests/pos-room-billing.test.mjs
      - name: Transfer bill editing regression tests
        run: node --experimental-strip-types --test tests/transfer-billing.test.mjs
      - name: Restaurant bill-delete regression tests
        run: node --experimental-strip-types --test tests/pos-bill-delete.test.mjs
      - name: Excursion billing regression tests
        run: node --experimental-strip-types --test tests/excursion-billing.test.mjs
      - name: External excursion self-service regression tests
        run: node --experimental-strip-types --test tests/excursion-manage.test.mjs
      - name: Excursion date-change auto-assignment regression tests
        run: node --experimental-strip-types --test tests/excursion-change-autoassign.test.mjs
      - name: Excursion booking reassignment regression tests
        run: node --experimental-strip-types --test tests/excursion-reassignment.test.mjs
      - name: Excursion time-change notification regression tests
        run: node --experimental-strip-types --test tests/excursion-time-change-notifications.test.mjs
      - name: Walk-in excursion WhatsApp notification regression tests
        run: node --experimental-strip-types --test tests/walkin-excursion-whatsapp.test.mjs
      - name: Excursion schedule dropdown regression tests
        run: node --experimental-strip-types --test tests/excursion-schedule-options.test.mjs
      - name: Special Package auto-scheduling regression tests
        run: node --experimental-strip-types --test tests/special-package-auto-schedule.test.mjs
      - name: Special Package structure regression tests
        run: node --experimental-strip-types --test tests/special-package-structure.test.mjs
      - name: 24-hour time format regression tests
        run: node --test tests/time-format-24h.test.mjs
      - name: Build production worker
        run: pnpm run build && node self-host-config.mjs dc69f294-de1e-4cd4-8322-93da8739eb73
      - name: Excursion timetable and guest-list consistency regression tests
        run: node --test tests/excursion-trip-counts.test.cjs
